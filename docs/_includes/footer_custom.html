<script>
/* Sätt översättningslänken dynamiskt till aktuell sidas URL */
document.addEventListener('DOMContentLoaded', function () {
  var link = document.getElementById('translate-link');
  if (link) link.href = 'https://translate.google.com/translate?sl=sv&u=' + encodeURIComponent(window.location.href);
});
</script>

<script>
/* Bionic Reading */
(function () {
  var COOKIE = 'bionicReading';
  var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, CODE: 1, PRE: 1, KBD: 1, SAMP: 1, BUTTON: 1 };

  function setCookie(name, val, days) {
    var d = new Date();
    d.setTime(d.getTime() + days * 864e5);
    document.cookie = name + '=' + val + '; expires=' + d.toUTCString() + '; path=/';
  }

  function getCookie(name) {
    var pairs = document.cookie.split(';');
    for (var i = 0; i < pairs.length; i++) {
      var pair = pairs[i].trim().split('=');
      if (pair[0] === name) return pair[1];
    }
    return null;
  }

  function bionicWord(word) {
    if (word.length <= 1) return word;
    var boldLen = Math.ceil(word.length / 2);
    return '<strong>' + word.slice(0, boldLen) + '</strong>' + word.slice(boldLen);
  }

  function applyBionic(node) {
    if (node.nodeType === 3) {
      var text = node.textContent;
      if (!text.trim()) return;
      var html = text.split(' ').map(function (w) {
        var match = w.match(/^([A-Za-zÀ-ɏåäöÅÄÖ]+)(.*)$/);
        if (!match || match[1].length <= 1) return w;
        return bionicWord(match[1]) + match[2];
      }).join(' ');
      var span = document.createElement('span');
      span.innerHTML = html;
      if (node.parentNode) node.parentNode.replaceChild(span, node);
    } else if (node.nodeType === 1 && !SKIP_TAGS[node.tagName]) {
      Array.from(node.childNodes).forEach(applyBionic);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('bionic-toggle');
    var content = document.getElementById('main-content');
    var active = getCookie(COOKIE) === 'true';

    function updateBtn() {
      btn.setAttribute('aria-pressed', String(active));
    }

    if (active && content) applyBionic(content);
    updateBtn();

    btn.addEventListener('click', function () {
      active = !active;
      setCookie(COOKIE, active, 30);
      updateBtn();
      if (active) {
        applyBionic(content);
      } else {
        window.location.reload();
      }
    });
  });
})();
</script>
